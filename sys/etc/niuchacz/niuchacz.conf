// Configuration file for niuchacz multiprocess service

// Work Manager defaults:
// - `min_count` is the default number of consumer workers to start
// - `max_count` is the upper bound the manager should not exceed
WORKERS =
{
    min_count = 2;
    max_count = 4;
};

niuchacz =
{
    // Global defaults shared across works (keep empty; add static values here later)
    // Ring buffer size. Accepts human-friendly string (e.g. "512MB", "1G")
    // Alternative keys: `ring_buffer_bytes` (integer bytes) or `ring_buffer_mb` (integer MB)
    ring_buffer = "512MB";
};

works =
{
    sqlite_consumer =
    {
        enabled = true;
        instances = 2;
        database_file = "/var/lib/niuchacz/niuchacz_production.db";
    };

    pcap_producer =
    {
        enabled = true;
        // per-interface instances currently spawn one per configured interface
        instances = 1;
        // list of interfaces to capture from (first is used)
        interfaces = ( "wlp0s20f0u10" );
        // libpcap/BPF filter string (optional). Example: capture only IPv4 TCP/UDP/ICMP
        capture_filter = "ip and (tcp or udp or icmp)";
        // sampling_rate: 0.0..1.0 (1.0 = keep all packets, 0.1 = keep ~10% randomly)
        sampling_rate = 1.0;
        // maximum payload bytes to enqueue (truncate long packets)
        // max_payload_bytes = 64;
    };
};